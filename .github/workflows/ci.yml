name: Issue #3 品質チェック

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint・型チェック・テスト・ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: pnpmを準備
        uses: pnpm/action-setup@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 依存関係をインストール
        run: pnpm install --no-frozen-lockfile

      - name: 品質チェックを実行
        run: pnpm check
