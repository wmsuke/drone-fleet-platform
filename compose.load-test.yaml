services:
  telemetry-ingestor:
    environment:
      LOAD_MEASUREMENT_START_AT: ${LOAD_MEASUREMENT_START_AT:-}
      LOAD_MEASUREMENT_END_AT: ${LOAD_MEASUREMENT_END_AT:-}

  load-generator:
    build:
      context: .
      target: runtime
    command: ["node", "apps/load-generator/dist/index.js"]
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      LOAD_TEST_ID: ${LOAD_TEST_ID}
      LOAD_SESSION_ID: ${LOAD_GENERATOR_SESSION_ID:-generator-1}
      LOAD_DEVICE_START: ${LOAD_DEVICE_START:-1}
      LOAD_DEVICE_COUNT: ${LOAD_DEVICE_COUNT:-2}
      LOAD_CONNECTION_RATE_PER_SECOND: ${LOAD_CONNECTION_RATE_PER_SECOND:-50}
      LOAD_TELEMETRY_INTERVAL_MS: ${LOAD_TELEMETRY_INTERVAL_MS:-50}
      LOAD_SIMULATION_SEED: ${LOAD_SIMULATION_SEED:-local-load}
      LOAD_MAX_MESSAGES: ${LOAD_MAX_MESSAGES:-6}
      LOAD_MAX_DURATION_MS: ${LOAD_MAX_DURATION_MS:-10000}
      LOAD_MEASUREMENT_START_AT: ${LOAD_MEASUREMENT_START_AT:-}
      LOAD_MEASUREMENT_DURATION_MS: ${LOAD_MEASUREMENT_DURATION_MS:-}
      LOAD_REPORT_PATH: ${LOAD_REPORT_PATH:-/workspace/load-results/generator-1.json}
      LOAD_READY_PATH: ${LOAD_READY_PATH:-}
    volumes:
      - ${LOAD_RESULTS_DIR}:/workspace/load-results
    depends_on:
      telemetry-ingestor:
        condition: service_started
    restart: "no"

  load-report:
    build:
      context: .
      target: runtime
    command: ["node", "apps/load-report/dist/index.js"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-drone_fleet}
      POSTGRES_USER: ${POSTGRES_USER:-drone_fleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      LOAD_TEST_ID: ${LOAD_TEST_ID}
      LOAD_GENERATOR_REPORT_PATHS: ${LOAD_GENERATOR_REPORT_PATHS:-/workspace/load-results/generator-a.json,/workspace/load-results/generator-b.json}
      LOAD_INGESTOR_REPORT_PATHS: /workspace/load-results/ingestor.json
      LOAD_AGGREGATE_REPORT_PATH: /workspace/load-results/report.json
    volumes:
      - ${LOAD_RESULTS_DIR}:/workspace/load-results
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
