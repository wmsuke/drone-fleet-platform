services:
  mqtt:
    image: eclipse-mosquitto:2.0.22
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./infra/local/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_pub -h localhost -p 1883 -t fleet/health -m ready",
        ]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  mosquitto-data:
